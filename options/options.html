<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>CSEnter — Advanced Settings</title>

  <style>
    *,
    *::before,
    *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    :root {
      --bg: #ffffff;
      --fg: #111111;
      --fg-sub: #555555;
      --focus: #0066cc;
      --border: #cccccc;
    }

    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #1e1e1e;
        --fg: #f0f0f0;
        --fg-sub: #aaaaaa;
        --focus: #4da6ff;
        --border: #555555;
      }
    }

    body {
      max-width: 480px;
      margin: 40px auto;
      padding: 0 24px 40px;
      font-family: system-ui, -apple-system, sans-serif;
      font-size: 14px;
      line-height: 1.6;
      background: var(--bg);
      color: var(--fg);
    }

    h1 {
      font-size: 18px;
      font-weight: 600;
      margin-bottom: 16px;
    }

    .description {
      margin-bottom: 24px;
      font-size: 14px;
      color: var(--fg-sub);
      line-height: 1.7;
    }

    .description a {
      color: var(--focus);
    }

    .description a:focus-visible {
      outline: 2px solid var(--focus);
      outline-offset: 2px;
      border-radius: 2px;
    }

    fieldset {
      border: 1px solid var(--border);
      border-radius: 6px;
      padding: 16px;
    }

    legend {
      font-size: 14px;
      font-weight: 600;
      padding: 0 6px;
      color: var(--fg-sub);
      text-transform: uppercase;
      letter-spacing: 0.06em;
    }

    .checkbox-group {
      display: flex;
      flex-direction: column;
      gap: 14px;
      margin-top: 14px;
    }

    label {
      display: flex;
      align-items: center;
      gap: 10px;
      cursor: pointer;
      font-size: 14px;
    }

    input[type="checkbox"] {
      appearance: none;
      -webkit-appearance: none;
      width: 16px;
      height: 16px;
      border: 1.5px solid var(--fg);
      border-radius: 3px;
      position: relative;
      flex-shrink: 0;
      cursor: pointer;
    }

    input[type="checkbox"]:checked {
      background: var(--fg);
    }

    input[type="checkbox"]:checked::after {
      content: "";
      position: absolute;
      top: 1px;
      left: 4px;
      width: 5px;
      height: 9px;
      border: 2px solid var(--bg);
      border-top: none;
      border-left: none;
      transform: rotate(45deg);
    }

    input[type="checkbox"]:focus-visible {
      outline: 2px solid var(--focus);
      outline-offset: 2px;
    }
  </style>
</head>

<body>
  <h1>Advanced Settings</h1>

  <p class="description">
    If a service update causes unexpected behavior, you can disable CSEnter for that service here while a fix is in progress.
    Found a bug? <a href="https://github.com/securecat/csenter/issues" target="_blank" rel="noopener">Report it on GitHub Issues</a>.
  </p>

  <fieldset>
    <legend>Enabled services</legend>
    <div class="checkbox-group">
      <label>
        <input type="checkbox" name="claude" />
        Claude (claude.ai)
      </label>
      <label>
        <input type="checkbox" name="chatgpt" />
        ChatGPT (chatgpt.com)
      </label>
      <label>
        <input type="checkbox" name="gemini" />
        Gemini (gemini.google.com)
      </label>
      <label>
        <input type="checkbox" name="google" />
        AI Mode in Google Search (google.com/search)
      </label>
    </div>
  </fieldset>

  <script src="options.js"></script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title data-i18n="optionsPageTitle">CSEnter — Advanced Settings</title>

  <style>
    *,
    *::before,
    *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    :root {
      --bg: #ffffff;
      --fg: #111111;
      --fg-sub: #555555;
      --focus: #0066cc;
      --border: #000000;
      --divider: #767676;
      --fs-base: 14px;
      --fs-heading: 18px;
    }

    :root:lang(ja) {
      --fs-base: 16px;
      --fs-heading: 20px;
    }

    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #1e1e1e;
        --fg: #f0f0f0;
        --fg-sub: #aaaaaa;
        --focus: #4da6ff;
        --border: #ffffff;
        --divider: #8a8a92;
      }
    }

    body {
      max-width: 480px;
      margin: 40px auto;
      padding: 0 24px 40px;
      font-family: sans-serif;
      font-size: var(--fs-base);
      line-height: 1.6;
      background: var(--bg);
      color: var(--fg);
    }

    h1 {
      font-size: var(--fs-heading);
      font-weight: 600;
      margin-bottom: 16px;
    }

    .description {
      margin-bottom: 14px;
      font-size: var(--fs-base);
      color: var(--fg-sub);
      line-height: 1.7;
    }

    .description + .checkbox-group {
      margin-top: 0;
    }

    hr {
      border: none;
      border-top: 1px solid var(--divider);
      margin: 24px 0;
    }

    .bug-report {
      font-size: var(--fs-base);
      color: var(--fg-sub);
      line-height: 1.7;
    }

    .bug-report a,
    .description a {
      color: var(--focus);
    }

    .bug-report a:focus-visible,
    .description a:focus-visible {
      outline: 2px solid var(--focus);
      outline-offset: 2px;
      border-radius: 2px;
    }

    fieldset {
      border: 1px solid var(--border);
      border-radius: 6px;
      padding: 16px;
    }

    fieldset + fieldset {
      margin-top: 20px;
    }

    legend {
      font-size: var(--fs-base);
      font-weight: 600;
      padding: 0 6px;
      color: var(--fg-sub);
      text-transform: uppercase;
      letter-spacing: 0.06em;
    }

    .checkbox-group,
    .radio-group {
      display: flex;
      flex-direction: column;
      gap: 14px;
      margin-top: 14px;
    }

    label {
      display: flex;
      align-items: center;
      gap: 10px;
      cursor: pointer;
      font-size: var(--fs-base);
    }

    input[type="checkbox"] {
      appearance: none;
      -webkit-appearance: none;
      width: 16px;
      height: 16px;
      border: 1.5px solid var(--fg);
      border-radius: 3px;
      position: relative;
      flex-shrink: 0;
      cursor: pointer;
    }

    input[type="checkbox"]:checked {
      background: var(--fg);
    }

    input[type="checkbox"]:checked::after {
      content: "";
      position: absolute;
      top: 1px;
      left: 4px;
      width: 5px;
      height: 9px;
      border: 2px solid var(--bg);
      border-top: none;
      border-left: none;
      transform: rotate(45deg);
    }

    input[type="checkbox"]:focus-visible {
      outline: 2px solid var(--focus);
      outline-offset: 2px;
    }

    input[type="radio"] {
      appearance: none;
      -webkit-appearance: none;
      width: 16px;
      height: 16px;
      border: 1.5px solid var(--fg);
      border-radius: 50%;
      position: relative;
      flex-shrink: 0;
      cursor: pointer;
    }

    input[type="radio"]:checked::after {
      content: "";
      position: absolute;
      top: 50%;
      left: 50%;
      width: 8px;
      height: 8px;
      transform: translate(-50%, -50%);
      border-radius: 50%;
      background: var(--fg);
    }

    input[type="radio"]:focus-visible {
      outline: 2px solid var(--focus);
      outline-offset: 2px;
    }
  </style>
</head>

<body>
  <h1 data-i18n="optionsTitle">Advanced Settings</h1>

  <fieldset>
    <legend data-i18n="optionsLanguageLegend">UI Language</legend>
    <div class="radio-group">
      <label>
        <input type="radio" name="uiLanguage" value="en" />
        English
      </label>
      <label>
        <input type="radio" name="uiLanguage" value="ja" />
        日本語
      </label>
    </div>
  </fieldset>

  <fieldset>
    <legend data-i18n="optionsServicesLegend">Enabled services</legend>
    <p class="description" data-i18n="optionsDescription">
      If a service update causes unexpected behavior, you can disable CSEnter for that service here while a fix is in progress.
    </p>
    <div class="checkbox-group">
      <label>
        <input type="checkbox" name="claude" />
        <span data-i18n="optionsServiceClaude">Claude (claude.ai)</span>
      </label>
      <label>
        <input type="checkbox" name="chatgpt" />
        <span data-i18n="optionsServiceChatgpt">ChatGPT (chatgpt.com)</span>
      </label>
      <label>
        <input type="checkbox" name="gemini" />
        <span data-i18n="optionsServiceGemini">Gemini (gemini.google.com)</span>
      </label>
      <label>
        <input type="checkbox" name="google" />
        <span data-i18n="optionsServiceGoogle">AI Mode in Google Search (google.com/search)</span>
      </label>
    </div>
  </fieldset>

  <hr>
  <p class="bug-report" data-i18n-html="optionsBugReportHtml">
    Found a bug? Report it on <a href="https://github.com/securecat/csenter/issues" target="_blank" rel="noopener">GitHub Issues</a>.
  </p>

  <script src="../i18n/i18n.js" defer></script>
  <script src="options.js" defer></script>
</body>
</html>
